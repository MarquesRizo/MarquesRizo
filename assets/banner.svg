<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Samuel Marques — Neural Rebirth Cyberpunk Banner</title>
  <desc id="bannerDesc">Cyberpunk Neural terminal banner featuring Samuel Marques and the R.I.Z.O. Eye-Star emblem.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04040a"/>
      <stop offset="50%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#020206"/>
    </linearGradient>

    <!-- Crimson Accents Gradient -->
    <linearGradient id="crimsonLaser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff1744" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanLaser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="neuralGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff1744" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#00e5ff" fill-opacity="0.25"/>
    </pattern>

    <!-- Subtle Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.35"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Eye-Star Gradients -->
    <radialGradient id="bannerEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="1"/>
      <stop offset="45%" stop-color="#b70025" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#55000f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#140004" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="bannerPupilAperture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff4569"/>
      <stop offset="70%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#3d000a"/>
    </radialGradient>
    <linearGradient id="bannerMetalSpike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#730014"/>
      <stop offset="100%" stop-color="#220006"/>
    </linearGradient>
    <linearGradient id="bannerSpikeEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4569"/>
      <stop offset="100%" stop-color="#b70025"/>
    </linearGradient>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="14" fill="url(#neuralGrid)"/>
  <rect width="1200" height="380" rx="14" fill="url(#scanlines)"/>
  
  <!-- Outer Tech Border with Cut Corners -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="13" fill="none" stroke="#252540" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="364" fill="none" stroke="#ff1744" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="8 12"/>

  <!-- HUD Terminal Header Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 1186 0 Q 1200 0 1200 14 L 1200 48 L 0 48 Z" fill="#0d0d1a" fill-opacity="0.95"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#ff1744" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Terminal Status Dots -->
  <circle cx="28" cy="24" r="5.5" fill="#ff1744" filter="url(#neonGlowRed)"/>
  <circle cx="48" cy="24" r="5.5" fill="#00e5ff" opacity="0.85"/>
  <circle cx="68" cy="24" r="5.5" fill="#00ff9d" opacity="0.85"/>

  <!-- Terminal Title & Breadcrumb -->
  <text x="96" y="29" fill="#9ba3c0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" letter-spacing="2">
    <tspan fill="#ff1744">SYS.ID:</tspan> MARQUESRIZO <tspan fill="#353560">//</tspan> OPERAÇÃO NEURAL REBIRTH <tspan fill="#353560">//</tspan> NODE_01
  </text>

  <!-- Header Right System Telemetry Badge -->
  <g transform="translate(980, 14)">
    <rect width="195" height="22" rx="4" fill="#111120" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="14" cy="11" r="3.5" fill="#00ff9d" filter="url(#neonGlowCyan)"/>
    <text x="26" y="15" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">SOVEREIGN CORE ONLINE</text>
  </g>

  <!-- Left Cyberpunk HUD Brackets and Corner Accents -->
  <path d="M 30 75 L 30 65 L 50 65" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 30 335 L 30 345 L 50 345" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 1170 75 L 1170 65 L 1150 65" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 1170 335 L 1170 345 L 1150 345" fill="none" stroke="#00e5ff" stroke-width="2"/>

  <!-- Background Decorative HUD Watermark & Circuit Lines -->
  <g opacity="0.25">
    <path d="M 600 70 L 720 70 L 760 110 L 890 110" fill="none" stroke="#ff1744" stroke-width="1.2"/>
    <circle cx="890" cy="110" r="3" fill="#ff1744"/>
    <path d="M 640 330 L 740 330 L 780 290 L 870 290" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="870" cy="290" r="3" fill="#00e5ff"/>
  </g>

  <!-- ================= MAIN CONTENT LEFT ================= -->

  <!-- Protocol Tag -->
  <g transform="translate(65, 88)">
    <rect width="270" height="24" rx="3" fill="rgba(255, 23, 68, 0.12)" stroke="#ff1744" stroke-width="0.9"/>
    <text x="12" y="16.5" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2.5">
      ▶ PROTOCOL // NEURAL ARCHITECT
    </text>
  </g>

  <!-- Name Hero Title -->
  <text x="62" y="172" fill="#f0f4ff" font-family="'Rajdhani', 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="2">
    SAMUEL <tspan fill="#ff1744">MARQUES</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="65" y="212" fill="#00e5ff" font-family="'Rajdhani', 'Segoe UI', monospace" font-size="21" font-weight="700" letter-spacing="4">
    SOFTWARE DEVELOPER <tspan fill="#ff1744">//</tspan> AUTONOMOUS AGENTS <tspan fill="#ff1744">//</tspan> SYSTEMS BUILDER
  </text>

  <!-- Secondary Description -->
  <text x="65" y="244" fill="#9ba3c0" font-family="'Inter', sans-serif" font-size="14.5" letter-spacing="0.5">
    Engenharia de software soberana, arquiteturas locais e orquestração de IA autônoma com R.I.Z.O.
  </text>

  <!-- Telemetry HUD Data Grid (3 Pills) -->
  <g transform="translate(65, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="5" fill="#0d0d1a" stroke="#252540" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="3" y2="42" stroke="#ff1744" stroke-width="3"/>
    <text x="14" y="17" fill="#5a5a7a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">FLAGSHIP PROJECT</text>
    <text x="14" y="32" fill="#f0f4ff" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">R.I.Z.O. v4.0</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="180" height="42" rx="5" fill="#0d0d1a" stroke="#252540" stroke-width="1.2"/>
    <line x1="195" y1="0" x2="198" y2="42" stroke="#00e5ff" stroke-width="3"/>
    <text x="209" y="17" fill="#5a5a7a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">SYSTEM PHILOSOPHY</text>
    <text x="209" y="32" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">SOVEREIGN &amp; LOCAL</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="180" height="42" rx="5" fill="#0d0d1a" stroke="#252540" stroke-width="1.2"/>
    <line x1="390" y1="0" x2="393" y2="42" stroke="#00ff9d" stroke-width="3"/>
    <text x="404" y="17" fill="#5a5a7a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">DEV ECOSYSTEM</text>
    <text x="404" y="32" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">PYTHON · C · JS</text>
  </g>

  <!-- Bottom Laser Divider Line -->
  <line x1="20" y1="346" x2="1180" y2="346" stroke="url(#crimsonLaser)" stroke-width="2"/>
  <line x1="65" y1="346" x2="350" y2="346" stroke="#00e5ff" stroke-width="2" filter="url(#neonGlowCyan)"/>

  <!-- Bottom Telemetry Ticker -->
  <text x="65" y="365" fill="#5a5a7a" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">
    LOCATION: BRASIL <tspan fill="#ff1744">|</tspan> FOCUS: CS &amp; AI AGENTS <tspan fill="#ff1744">|</tspan> MATRIX REBIRTH: ACTIVE
  </text>

  <text x="1135" y="365" text-anchor="end" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1.5">
    SYS_VER: 4.0.0 // MARQUESRIZO
  </text>

  <!-- ================= RIGHT SIDE: R.I.Z.O. EYE-STAR LOGO ================= -->
  <!-- Target Center: x=980, y=198, radius approx 110 -->
  <g transform="translate(980, 196)">
    <!-- Ambient Behind Logo Glow -->
    <circle cx="0" cy="0" r="105" fill="#ff1744" fill-opacity="0.12" filter="url(#neonGlowRed)"/>
    <circle cx="0" cy="0" r="75" fill="#00e5ff" fill-opacity="0.08" filter="url(#neonGlowCyan)"/>

    <!-- Outer Decorative HUD Radar Sweep Circles -->
    <circle cx="0" cy="0" r="126" stroke="#ff1744" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.35"/>
    <circle cx="0" cy="0" r="115" stroke="#252540" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="112" stroke="#00e5ff" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.6"/>

    <!-- External Compass Degree Markers -->
    <line x1="0" y1="-128" x2="0" y2="-120" stroke="#00e5ff" stroke-width="2"/>
    <line x1="0" y1="120" x2="0" y2="128" stroke="#00e5ff" stroke-width="2"/>
    <line x1="-128" y1="0" x2="-120" y2="0" stroke="#00e5ff" stroke-width="2"/>
    <line x1="120" y1="0" x2="128" y2="0" stroke="#00e5ff" stroke-width="2"/>

    <!-- Scaled Eye-Star Emblem (Scale 2.1, centered: origin -50*2.1 = -105) -->
    <g transform="scale(2.1) translate(-50, -50)">
      <!-- Outer Telemetry Rings -->
      <circle cx="50" cy="50" r="46" stroke="#ff1744" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6"/>
      <circle cx="50" cy="50" r="41" stroke="#ff1744" stroke-width="0.5" opacity="0.75"/>
      
      <!-- Crosshairs -->
      <path d="M 50 3 L 50 14 M 50 86 L 50 97 M 3 50 L 14 50 M 86 50 L 97 50" stroke="#ff1744" stroke-width="1.2" opacity="0.9"/>
      <circle cx="50" cy="14" r="1.5" fill="#00e5ff"/>
      <circle cx="50" cy="86" r="1.5" fill="#00e5ff"/>
      <circle cx="14" cy="50" r="1.5" fill="#00e5ff"/>
      <circle cx="86" cy="50" r="1.5" fill="#00e5ff"/>

      <!-- 8-Point Compass Spikes -->
      <polygon points="50,2 53.5,24 50,21 46.5,24" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="50,98 53.5,76 50,79 46.5,76" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="98,50 76,53.5 79,50 76,46.5" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="2,50 24,53.5 21,50 24,46.5" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="84,16 67,31 69,27 65,25" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="16,16 33,31 31,27 35,25" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="84,84 67,69 69,73 65,75" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>
      <polygon points="16,84 33,69 31,73 35,75" fill="url(#bannerMetalSpike)" stroke="url(#bannerSpikeEdge)" stroke-width="0.75"/>

      <!-- Mid Ring -->
      <polygon points="50,25 57,33 67,29 65,39 75,43 69,50 75,57 65,61 67,71 57,67 50,75 43,67 33,71 35,61 25,57 31,50 25,43 35,39 33,29 43,33" fill="#0d0d1a" stroke="#ff1744" stroke-width="0.8" opacity="0.95"/>

      <!-- Reticle Circle -->
      <circle cx="50" cy="50" r="23" fill="#070710" stroke="#ff1744" stroke-width="1.3"/>
      <circle cx="50" cy="50" r="21" stroke="#ff1744" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.7"/>

      <!-- Almond Eye -->
      <path d="M 27 50 Q 50 31 73 50 Q 50 69 27 50 Z" fill="#090a14" stroke="#ff1744" stroke-width="1.8"/>
      <path d="M 31 50 Q 50 35 69 50" stroke="#ff4569" stroke-width="0.75" opacity="0.6"/>
      <path d="M 31 50 Q 50 65 69 50" stroke="#ff4569" stroke-width="0.75" opacity="0.6"/>

      <!-- Iris & Pupil -->
      <circle cx="50" cy="50" r="11" fill="url(#bannerEyeGlow)" stroke="#ff1744" stroke-width="1"/>
      <circle cx="50" cy="50" r="9" stroke="#ff1744" stroke-width="0.5" stroke-dasharray="1.5 2"/>
      <polygon points="50,42 54,50 50,58 46,50" fill="url(#bannerPupilAperture)"/>
      <circle cx="50" cy="50" r="2" fill="#ffffff"/>

      <!-- Cyber Brackets -->
      <path d="M 26 47 L 24 50 L 26 53" stroke="#00e5ff" stroke-width="1.2" fill="none"/>
      <path d="M 74 47 L 76 50 L 74 53" stroke="#00e5ff" stroke-width="1.2" fill="none"/>
      <line x1="18" y1="50" x2="23" y2="50" stroke="#00e5ff" stroke-width="1.2"/>
      <line x1="77" y1="50" x2="82" y2="50" stroke="#00e5ff" stroke-width="1.2"/>
    </g>

    <!-- Sub-Emblem Label Badge -->
    <rect x="-65" y="105" width="130" height="20" rx="3" fill="#04040a" stroke="#ff1744" stroke-width="0.8"/>
    <text x="0" y="119" text-anchor="middle" fill="#f0f4ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="2">
      R.I.Z.O. EMBLEM
    </text>
  </g>
</svg>
