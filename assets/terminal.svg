<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="R.I.Z.O. System Initialization Terminal">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070712"/>
      <stop offset="50%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#04040a"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="termScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Subtle Red Glow Filter -->
    <filter id="neonRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Cyan Glow Filter -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="998" height="238" rx="8" fill="url(#termBg)"/>
  <rect x="1" y="1" width="998" height="238" rx="8" fill="url(#termScanlines)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="998" height="238" rx="8" fill="none" stroke="#252540" stroke-width="1.5"/>
  <rect x="6" y="6" width="988" height="228" rx="6" fill="none" stroke="#ff1744" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="6 8"/>

  <!-- Terminal Header Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 991 1 Q 999 1 999 9 L 999 38 L 1 38 Z" fill="#0d0d1a"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#ff1744" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Window Dots -->
  <circle cx="22" cy="19" r="4.5" fill="#ff1744" filter="url(#neonRedGlow)"/>
  <circle cx="38" cy="19" r="4.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="54" cy="19" r="4.5" fill="#00ff9d" opacity="0.8"/>

  <!-- Terminal Header Title -->
  <text x="75" y="23" fill="#9ba3c0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" letter-spacing="1.5">
    <tspan fill="#ff1744">BOOT_SEQUENCE</tspan> // RIZO-OS v4.0 // IDENTITY_INITIALIZATION
  </text>

  <!-- Right Header Badge -->
  <g transform="translate(815, 10)">
    <rect width="165" height="18" rx="3" fill="#111120" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="10" cy="9" r="3" fill="#00ff9d"/>
    <text x="20" y="13" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">ACCESS: GRANTED</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 58 L 20 50 L 28 50" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 20 212 L 20 220 L 28 220" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 980 58 L 980 50 L 972 50" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 980 212 L 980 220 L 972 220" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Boot Command -->
  <text x="40" y="70" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" letter-spacing="1">
    <tspan fill="#ff1744" font-weight="700">SYS_INIT &gt;&gt;</tspan> <tspan fill="#00e5ff">INITIALIZING USER PROFILE...</tspan> <tspan fill="#00ff9d">[STATUS: READY]</tspan>
  </text>

  <!-- Line 2: User Identification -->
  <text x="40" y="100" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" letter-spacing="1">
    <tspan fill="#5a5a7a">&gt;</tspan> <tspan fill="#9ba3c0">USER:</tspan> <tspan fill="#f0f4ff" font-weight="700">SAMUEL MARQUES</tspan> <tspan fill="#5a5a7a">//</tspan> <tspan fill="#00e5ff">MarquesRizo</tspan>
  </text>

  <!-- Line 3: Access Level -->
  <text x="40" y="130" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" letter-spacing="1">
    <tspan fill="#5a5a7a">&gt;</tspan> <tspan fill="#9ba3c0">ACCESS LEVEL:</tspan> <tspan fill="#ff1744" font-weight="700">DEVELOPER</tspan> <tspan fill="#5a5a7a">[PERMISSION_LEVEL_4: AUTONOMOUS_SYSTEMS]</tspan>
  </text>

  <!-- Line 4: Status -->
  <text x="40" y="160" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" letter-spacing="1">
    <tspan fill="#5a5a7a">&gt;</tspan> <tspan fill="#9ba3c0">STATUS:</tspan> <tspan fill="#00ff9d" font-weight="700">● ONLINE</tspan> <tspan fill="#5a5a7a">//</tspan> <tspan fill="#9ba3c0">LOCAL-FIRST ENGINE OPERATIONAL</tspan>
  </text>

  <!-- Line 5: Environment -->
  <text x="40" y="190" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" letter-spacing="1">
    <tspan fill="#5a5a7a">&gt;</tspan> <tspan fill="#9ba3c0">ENVIRONMENT:</tspan> <tspan fill="#00e5ff" font-weight="600">SOFTWARE DEVELOPMENT</tspan> <tspan fill="#5a5a7a">&amp;</tspan> <tspan fill="#ff1744" font-weight="600">AUTONOMOUS INTELLIGENCE</tspan>
  </text>

  <!-- Line 6: Prompt & Cursor -->
  <text x="40" y="218" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" letter-spacing="1">
    <tspan fill="#ff1744" font-weight="700">root@rizo-core:~$</tspan> <tspan fill="#9ba3c0">loading_neural_matrix_telemetry...</tspan>
  </text>
  <!-- Blinking Cursor -->
  <rect x="420" y="206" width="9" height="15" fill="#00e5ff" filter="url(#neonCyanGlow)"/>
</svg>
