<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="R.I.Z.O. Cyberpunk Neural Divider">
  <defs>
    <linearGradient id="divRedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff1744" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Horizontal Laser Line -->
  <line x1="40" y1="17" x2="1160" y2="17" stroke="url(#divRedGrad)" stroke-width="1.5"/>

  <!-- Left & Right Cyan Corner Angled Brackets -->
  <path d="M 430 17 L 448 6 L 540 6" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.9"/>
  <path d="M 770 17 L 752 6 L 660 6" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.9"/>
  <path d="M 460 28 L 540 28" stroke="#ff1744" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M 740 28 L 660 28" stroke="#ff1744" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Center Diamond Reticle HUD -->
  <polygon points="600,3 615,17 600,31 585,17" fill="#04040a" stroke="#00e5ff" stroke-width="1.5" filter="url(#divGlow)"/>
  <polygon points="600,8 609,17 600,26 591,17" fill="#ff1744" fill-opacity="0.3" stroke="#ff1744" stroke-width="1"/>
  <circle cx="600" cy="17" r="3" fill="#ffffff" filter="url(#divGlow)"/>

  <!-- Flanking Cyan Crosshairs -->
  <circle cx="560" cy="17" r="2.5" fill="#00e5ff"/>
  <circle cx="640" cy="17" r="2.5" fill="#00e5ff"/>
</svg>
